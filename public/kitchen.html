<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f0b87a" />
  <title>Kitchen — Oct Cafe</title>
  <link rel="icon" href="/icons/oct-cafe-logo.png?v=party26" type="image/png" />
  <link rel="stylesheet" href="/styles.css?v=party26" />
</head>
<body class="page-kitchen">
  <main class="wrap wrap--wide">
    <header class="kitchen-header">
      <div class="kitchen-header__brand">
        <img class="kitchen-header__logo" src="/icons/oct-cafe-logo.png?v=party26" width="96" height="56" alt="" />
        <div>
          <h1>🍳 Kitchen · Oct Cafe</h1>
          <p class="kitchen-header__sub">
            Matt &amp; Nikki's birthday service · auto-refreshes
          </p>
        </div>
      </div>
      <nav class="nav-links" aria-label="Navigation">
        <a class="chip-link" href="/">← Menu</a>
        <a class="chip-link" href="/qr">QR</a>
        <button type="button" class="chip-link" id="armSound" aria-pressed="true" title="Order chime is on — tap to mute">🔔 Sound on</button>
        <span class="kitchen-alert-badge" id="newOrderBadge" hidden>0 new</span>
        <button type="button" class="chip-link" id="clearDone">Clear done</button>
      </nav>
    </header>

    <div class="status-filters" role="group" aria-label="Filter by status">
      <button type="button" class="filter-btn" data-filter="open" aria-pressed="true">Open</button>
      <button type="button" class="filter-btn" data-filter="new" aria-pressed="false">New</button>
      <button type="button" class="filter-btn" data-filter="making" aria-pressed="false">Making</button>
      <button type="button" class="filter-btn" data-filter="ready" aria-pressed="false">Ready</button>
      <button type="button" class="filter-btn" data-filter="done" aria-pressed="false">Done</button>
      <button type="button" class="filter-btn" data-filter="all" aria-pressed="false">All</button>
    </div>

    <div id="ordersRoot" class="orders-grid" style="margin-top:1rem;" aria-live="polite"></div>

    <details class="sold-out-panel" id="soldOutPanel">
      <summary class="sold-out-panel__summary">
        <span class="sold-out-panel__summary-title">🍃 Sold out</span>
        <span class="sold-out-panel__summary-meta" id="soldOutSummaryMeta">tap to manage</span>
      </summary>
      <p class="sold-out-panel__hint">Flip items off when you’re out — guests see them greyed on the menu</p>
      <div id="soldOutRoot" class="sold-out-grid"></div>
    </details>
  </main>

  <script src="/kitchen.js?v=party26" defer></script>
</body>
</html>
